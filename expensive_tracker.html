<!DOCTYPE html>
<html>
<head>
    <title>Personal Expense Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            margin: 0;
            padding: 40px;
        }

        .box {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #4a4a8a;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input, select {
            border: 1px solid #ccc;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-top: 18px;
        }

        button:hover {
            background: #388E3C;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f3f7ff;
            border-radius: 10px;
        }

        .result h3 {
            color: #4a4a8a;
        }

        .saving {
            color: #16823a;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>💰 Expense Calculator</h1>

    <label>Monthly Income</label>
    <input type="number" id="income" placeholder="Enter income">

    <label>Expense Amount</label>
    <input type="number" id="expense" placeholder="Enter expense">

    <label>Expense Category</label>
    <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Education</option>
        <option>Shopping</option>
        <option>Others</option>
    </select>

    <button onclick="addExpense()">➕ Add Expense</button>

    <div class="result">
        <h3>📊 Summary Report</h3>

        <p>💵 Income: ₹<span id="totalIncome">0</span></p>
        <p>💸 Expenses: ₹<span id="totalExpense">0</span></p>
        <p class="saving">💰 Savings: ₹<span id="savings">0</span></p>

        <h4>📋 Expense Details</h4>
        <ul id="expenseList"></ul>
    </div>

</div>

<script>
    let totalExpense = 0;

    function addExpense() {

        let income = Number(document.getElementById("income").value);
        let expense = Number(document.getElementById("expense").value);
        let category = document.getElementById("category").value;

        if (income <= 0 || expense <= 0) {
            alert("Please enter valid income and expense.");
            return;
        }

        totalExpense += expense;

        let savings = income - totalExpense;

        document.getElementById("totalIncome").innerText = income;
        document.getElementById("totalExpense").innerText = totalExpense;
        document.getElementById("savings").innerText = savings;

        let item = document.createElement("li");
        item.innerText = category + " - ₹" + expense;

        document.getElementById("expenseList").appendChild(item);

        document.getElementById("expense").value = "";
    }
</script>

</body>
</html>
