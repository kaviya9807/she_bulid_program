<!DOCTYPE html>
<html>
<head>
    <title>Personal Expense Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #eeeeee;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Personal Expense Calculator</h1>

    <label>Income:</label>
    <input type="number" id="income" placeholder="Enter your income">

    <label>Expense Amount:</label>
    <input type="number" id="expense" placeholder="Enter expense amount">

    <label>Category:</label>
    <select id="category">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Education">Education</option>
        <option value="Shopping">Shopping</option>
        <option value="Others">Others</option>
    </select>

    <button onclick="addExpense()">Add Expense</button>

    <div class="result">
        <h3>Summary Report</h3>

        <p>Total Income: ₹<span id="totalIncome">0</span></p>

        <p>Total Expense: ₹<span id="totalExpense">0</span></p>

        <p>Savings: ₹<span id="savings">0</span></p>

        <h4>Expense Details:</h4>
        <ul id="expenseList"></ul>
    </div>

</div>

<script>

let totalExpense = 0;

function addExpense() {

    let income = Number(document.getElementById("income").value);
    let expense = Number(document.getElementById("expense").value);
    let category = document.getElementById("category").value;

    if (income <= 0 || expense <= 0) {
        alert("Please enter valid values.");
        return;
    }

    totalExpense = totalExpense + expense;

    let savings = income - totalExpense;

    document.getElementById("totalIncome").innerText = income;
    document.getElementById("totalExpense").innerText = totalExpense;
    document.getElementById("savings").innerText = savings;

    let item = document.createElement("li");

    item.innerText = category + " - ₹" + expense;

    document.getElementById("expenseList").appendChild(item);

    document.getElementById("expense").value = "";
}

</script>

</body>
</html>
